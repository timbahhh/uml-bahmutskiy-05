name: Render diagrams

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Download PlantUML
        run: |
          curl -fL -o plantuml.jar \
            https://github.com/plantuml/plantuml/releases/download/v1.2025.2/plantuml-1.2025.2.jar

      - name: Render PNG
        shell: bash
        run: |
          set -e
          mkdir -p out/png

          while IFS= read -r -d '' file; do
            echo "Проверяю файл: $file"
            java -jar plantuml.jar -failfast2 -tpng "$file" -o "$GITHUB_WORKSPACE/out/png"
          done < <(find docs -type f -name '*.puml' -print0)

      - name: Render SVG
        shell: bash
        run: |
          set -e
          mkdir -p out/svg

          while IFS= read -r -d '' file; do
            echo "Рендерю файл: $file"
            java -jar plantuml.jar -failfast2 -tsvg "$file" -o "$GITHUB_WORKSPACE/out/svg"
          done < <(find docs -type f -name '*.puml' -print0)

      - uses: actions/upload-artifact@v4
        with:
          name: diagrams
          path: out/
